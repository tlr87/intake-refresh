<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --error: #ef4444;
      --success: #22c55e;
      --danger: #dc2626;
      --info: #0ea5e9;
    }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; background: var(--bg); color: var(--text); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .title { font-size: 18px; font-weight: 700; color: #38bdf8; }
    
    .tabs-nav { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px; }
    .tab-btn { background: #090d16; color: var(--muted); border: 1px solid var(--border); border-bottom: none; border-radius: 6px 6px 0 0; padding: 10px 16px; font-weight: 600; font-size: 12px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .tab-btn:hover { color: var(--text); background: var(--panel); }
    .tab-btn.active { background: var(--panel); color: #38bdf8; border-color: var(--accent); border-bottom: 2px solid var(--panel); margin-bottom: -2px; }
    
    .tab-content { display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .tab-content.active { display: block; }

    .meta-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .prop-title { font-size: 13px; font-weight: 700; color: #e2e8f0; font-family: monospace; }
    .action-btns { display: flex; gap: 8px; align-items: center; }

    .badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; display: inline-block; text-transform: uppercase; }
    .badge.valid { background: #14532d; color: #4ade80; }
    .badge.invalid { background: #7f1d1d; color: #fca5a5; }

    textarea { width: 100%; height: 340px; font-family: monospace; font-size: 13px; padding: 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; background: #090d16; color: #e2e8f0; resize: vertical; line-height: 1.4; }
    textarea:focus { border-color: var(--accent); outline: none; }
    textarea.has-error { border-color: var(--error); background: #1c0d12; }
    .error-msg { font-size: 12px; color: #fca5a5; margin-top: 6px; min-height: 16px; }

    .controls { display: flex; gap: 12px; align-items: center; background: var(--panel); padding: 14px; border-radius: 8px; border: 1px solid var(--border); margin-top: 16px; }
    .btn { background: var(--accent); color: #ffffff; border: none; padding: 10px 20px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; }
    .btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; }

    .btn-secondary { background: #334155; color: #f8fafc; padding: 6px 12px; font-size: 11px; font-weight: 600; border: none; border-radius: 4px; cursor: pointer; }
    .btn-add { background: #166534; color: #ffffff; padding: 6px 12px; font-size: 11px; font-weight: 600; border: none; border-radius: 4px; cursor: pointer; }
    .btn-danger { background: var(--danger); color: #ffffff; padding: 6px 12px; font-size: 11px; font-weight: 600; border: none; border-radius: 4px; cursor: pointer; }
    .btn-test { background: var(--info); color: #ffffff; padding: 6px 12px; font-size: 11px; font-weight: 600; border: none; border-radius: 4px; cursor: pointer; }
    .btn-test:disabled { background: #475569; opacity: 0.7; cursor: wait; }

    #status { font-size: 13px; font-weight: 600; display: none; padding: 8px 14px; border-radius: 6px; }
    .status-success { background: #14532d; color: #4ade80; }
    .status-error { background: #7f1d1d; color: #fca5a5; }

    /* Modal Styling for Test Results */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 1000; justify-content: center; align-items: center; }
    .modal-box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; width: 80%; max-width: 700px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .modal-title { font-weight: 700; font-size: 15px; color: #38bdf8; }
    .modal-close { background: transparent; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
    .modal-body { padding: 18px; overflow-y: auto; flex-grow: 1; }
    .modal-footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }
    .test-log { background: #090d16; color: #e2e8f0; font-family: monospace; font-size: 12px; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; border: 1px solid var(--border); margin-top: 12px; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; text-align: center; }
    .summary-card { background: #090d16; padding: 8px; border-radius: 6px; border: 1px solid var(--border); }
    .summary-card .num { font-size: 16px; font-weight: 700; }
    .summary-card .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">RD3 Tech — Protected Configuration Editor</div>
    <div class="action-btns">
      <button class="btn-secondary" onclick="exportBackupJSON()">📥 Backup (JSON)</button>
      <button class="btn-secondary" onclick="triggerImportJSON()">📤 Import (JSON)</button>
      <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importBackupJSON(event)">
    </div>
  </div>

  <!-- Server data injected safely into hidden container -->
  <div id="rawServerData" style="display:none;"><?!= initialDataJson ?></div>

  <div id="tabsNav" class="tabs-nav"></div>
  <div id="panelsContainer"></div>

  <div class="controls">
    <button id="saveBtn" class="btn" onclick="saveConfigs()">Save All Configurations</button>
    <div id="status"></div>
  </div>

  <!-- Modal overlay for Form Validation Results -->
  <div id="testModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Google Form Validation Results</div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="summary-grid">
          <div class="summary-card"><div class="num" id="statConfigured">0</div><div class="lbl">Configured</div></div>
          <div class="summary-card"><div class="num" style="color: #4ade80;" id="statPassed">0</div><div class="lbl">Passed</div></div>
          <div class="summary-card"><div class="num" style="color: #fca5a5;" id="statFailed">0</div><div class="lbl">Failed</div></div>
          <div class="summary-card"><div class="num" style="color: #fde047;" id="statUnaccounted">0</div><div class="lbl">Unaccounted</div></div>
        </div>
        <div id="modalLog" class="test-log">Running test...</div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    var configData = {};
    var activeTabKey = '';

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function init() {
      try {
        var rawText = document.getElementById('rawServerData').textContent;
        configData = JSON.parse(rawText) || {};
        activeTabKey = Object.keys(configData)[0] || '';
        renderEditorUI();
      } catch(e) {
        document.getElementById('panelsContainer').innerHTML = 
          '<div style="color:var(--error); padding:20px;">Failed to render configurations: ' + escapeHtml(e.message) + '</div>';
      }
    }

    function renderEditorUI() {
      var navContainer = document.getElementById('tabsNav');
      var panelsContainer = document.getElementById('panelsContainer');
      
      navContainer.innerHTML = '';
      panelsContainer.innerHTML = '';

      var keys = Object.keys(configData);

      if (keys.length === 0) {
        panelsContainer.innerHTML = '<div style="padding: 40px; text-align: center; background: var(--panel); border-radius: 8px;">' +
            '<p style="color: var(--muted);">No properties found in Script Properties.</p>' +
            '<button class="btn-add" onclick="addNewProperty()">+ Add New Property</button>' +
          '</div>';
        document.getElementById('saveBtn').disabled = true;
        return;
      }

      if (keys.indexOf(activeTabKey) === -1) {
        activeTabKey = keys[0];
      }

      keys.forEach(function(key) {
        var tabBtn = document.createElement('button');
        tabBtn.className = 'tab-btn' + (key === activeTabKey ? ' active' : '');
        tabBtn.onclick = function() { switchTab(key); };
        tabBtn.innerHTML = escapeHtml(key) + ' <span id="dot-' + escapeHtml(key) + '" class="badge valid">Valid</span>';
        navContainer.appendChild(tabBtn);

        var valStr = typeof configData[key] === 'object' 
          ? JSON.stringify(configData[key], null, 2) 
          : String(configData[key]);

        var panel = document.createElement('div');
        panel.id = 'panel-' + key;
        panel.className = 'tab-content' + (key === activeTabKey ? ' active' : '');
        
        // Conditionally show "Validate Google Form IDs" button on FORM_CONFIG tab
        var testButtonHtml = (key === 'FORM_CONFIG') 
          ? '<button class="btn-test" onclick="runFormValidationTest(this)">🔍 Validate Google Form IDs</button>' 
          : '';

        panel.innerHTML = '<div class="meta-bar">' +
            '<span class="prop-title">Script Property: ' + escapeHtml(key) + '</span>' +
            '<div class="action-btns">' +
              testButtonHtml +
              '<button class="btn-secondary" onclick="restoreFallback(\'' + escapeHtml(key) + '\')">Restore Fallback</button>' +
              '<button class="btn-add" onclick="addNewProperty()">+ Add Property</button>' +
              '<button class="btn-danger" onclick="removeProperty(\'' + escapeHtml(key) + '\')">- Delete Property</button>' +
              '<button class="btn-secondary" onclick="formatJSON(\'' + escapeHtml(key) + '\')">Format JSON</button>' +
            '</div>' +
          '</div>' +
          '<textarea id="' + escapeHtml(key) + '" oninput="validateField(\'' + escapeHtml(key) + '\')">' + escapeHtml(valStr) + '</textarea>' +
          '<div id="err-' + escapeHtml(key) + '" class="error-msg"></div>';

        panelsContainer.appendChild(panel);
      });

      keys.forEach(function(key) { validateField(key); });
    }

    function switchTab(selectedKey) {
      activeTabKey = selectedKey;
      var keys = Object.keys(configData);
      
      var buttons = document.querySelectorAll('.tab-btn');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.toggle('active', keys[i] === selectedKey);
      }

      var panels = document.querySelectorAll('.tab-content');
      for (var j = 0; j < panels.length; j++) {
        panels[j].classList.toggle('active', panels[j].id === 'panel-' + selectedKey);
      }
    }

    function runFormValidationTest(btn) {
      var origText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '⏳ Validating...';

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.innerHTML = origText;
          showValidationModal(res);
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerHTML = origText;
          alert('Validation failed to execute: ' + err.message);
        })
        .runFormValidationFromUi();
    }

    function showValidationModal(res) {
      document.getElementById('statConfigured').textContent = res.totalConfigured;
      document.getElementById('statPassed').textContent = res.passed;
      document.getElementById('statFailed').textContent = res.failed;
      document.getElementById('statUnaccounted').textContent = res.unaccounted;

      var logContainer = document.getElementById('modalLog');
      logContainer.textContent = res.details ? res.details.join('\n') : 'No log details available.';

      document.getElementById('testModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('testModal').style.display = 'none';
    }

    function addNewProperty() {
      var propName = prompt('Enter new Script Property key name (e.g. FORM_CONFIG):');
      if (!propName) return;
      
      var cleanKey = propName.trim().toUpperCase().replace(/[^A-Z0-9_]/g, '_');
      if (!cleanKey) {
        alert('Invalid property key name.');
        return;
      }

      if (configData[cleanKey]) {
        alert('Property key "' + cleanKey + '" already exists.');
        switchTab(cleanKey);
        return;
      }

      configData[cleanKey] = {};
      activeTabKey = cleanKey;
      renderEditorUI();
    }

    function removeProperty(key) {
      if (!confirm('Are you sure you want to delete "' + key + '"?')) return;

      delete configData[key];
      var keys = Object.keys(configData);
      activeTabKey = keys.length > 0 ? keys[0] : '';
      renderEditorUI();
    }

    function restoreFallback(key) {
      if (!confirm('Reset "' + key + '" to default fallback configuration?')) return;

      var statusDiv = document.getElementById('status');
      statusDiv.className = '';
      statusDiv.style.display = 'block';
      statusDiv.textContent = 'Fetching fallback data for ' + key + '...';

      google.script.run
        .withSuccessHandler(function(rawResponse) {
          try {
            var fallbackData = typeof rawResponse === 'string' ? JSON.parse(rawResponse) : rawResponse;
            
            configData[key] = fallbackData;
            var textarea = document.getElementById(key);
            if (textarea) {
              textarea.value = JSON.stringify(fallbackData, null, 2);
              validateField(key);
            }

            statusDiv.className = 'status-success';
            statusDiv.textContent = '✔ Restored "' + key + '" from fallback provider!';
            setTimeout(function() { statusDiv.style.display = 'none'; }, 4000);
          } catch(e) {
            statusDiv.className = 'status-error';
            statusDiv.textContent = 'Error parsing fallback JSON: ' + e.message;
          }
        })
        .withFailureHandler(function(err) {
          statusDiv.className = 'status-error';
          statusDiv.textContent = 'Restore failed: ' + err.message;
        })
        .resetKeyToFallback(key);
    }

    function exportBackupJSON() {
      var exportData = {};
      var keys = Object.keys(configData);

      for (var i = 0; i < keys.length; i++) {
        var key = keys[i];
        var textarea = document.getElementById(key);
        if (textarea) {
          try {
            exportData[key] = JSON.parse(textarea.value);
          } catch(e) {
            exportData[key] = textarea.value;
          }
        } else {
          exportData[key] = configData[key];
        }
      }

      var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
      var downloadAnchor = document.createElement('a');
      var timeStamp = new Date().toISOString().slice(0, 10);
      
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "script_properties_backup_" + timeStamp + ".json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerImportJSON() {
      document.getElementById('importFileInput').click();
    }

    function importBackupJSON(event) {
      var file = event.target.files[0];
      if (!file) return;

      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var importedObj = JSON.parse(e.target.result);
          if (typeof importedObj !== 'object' || importedObj === null || Array.isArray(importedObj)) {
            throw new Error('Imported JSON must be a top-level key-value object.');
          }

          if (!confirm('Overwrite current form state with imported backup file? Click "Save All Configurations" afterwards to commit to Google Script Properties.')) {
            event.target.value = '';
            return;
          }

          configData = importedObj;
          activeTabKey = Object.keys(configData)[0] || '';
          renderEditorUI();
          
          var statusDiv = document.getElementById('status');
          statusDiv.className = 'status-success';
          statusDiv.style.display = 'block';
          statusDiv.textContent = '✔ Backup file imported into editor UI!';
          setTimeout(function() { statusDiv.style.display = 'none'; }, 4000);
        } catch(err) {
          alert('Failed to import JSON file: ' + err.message);
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    function validateField(key) {
      var textarea = document.getElementById(key);
      var dot = document.getElementById('dot-' + key);
      var errDiv = document.getElementById('err-' + key);
      if (!textarea) return false;
      
      try {
        var parsed = JSON.parse(textarea.value);
        if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
          throw new Error('Config must be a valid JSON Object {}');
        }

        textarea.classList.remove('has-error');
        if (dot) {
          dot.className = 'badge valid';
          dot.textContent = 'Valid';
        }
        if (errDiv) errDiv.textContent = '';
        checkGlobalValidity();
        return true;
      } catch (e) {
        textarea.classList.add('has-error');
        if (dot) {
          dot.className = 'badge invalid';
          dot.textContent = 'Error';
        }
        if (errDiv) errDiv.textContent = e.message;
        checkGlobalValidity();
        return false;
      }
    }

    function checkGlobalValidity() {
      var keys = Object.keys(configData);
      var allValid = keys.length > 0;
      
      keys.forEach(function(key) {
        var textarea = document.getElementById(key);
        if (!textarea) {
          allValid = false;
          return;
        }
        try {
          var parsed = JSON.parse(textarea.value);
          if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) allValid = false;
        } catch(e) {
          allValid = false;
        }
      });

      document.getElementById('saveBtn').disabled = !allValid;
    }

    function formatJSON(key) {
      var textarea = document.getElementById(key);
      if (!textarea) return;
      try {
        var parsed = JSON.parse(textarea.value);
        textarea.value = JSON.stringify(parsed, null, 2);
        validateField(key);
      } catch(e) {}
    }

    function saveConfigs() {
      var payload = {};
      var keys = Object.keys(configData);
      var statusDiv = document.getElementById('status');
      
      for (var i = 0; i < keys.length; i++) {
        var key = keys[i];
        var textarea = document.getElementById(key);
        try {
          payload[key] = JSON.parse(textarea.value);
        } catch (e) {
          statusDiv.className = 'status-error';
          statusDiv.style.display = 'block';
          statusDiv.textContent = 'Save blocked: Syntax error in ' + key;
          return;
        }
      }

      document.getElementById('saveBtn').disabled = true;
      statusDiv.className = '';
      statusDiv.style.display = 'block';
      statusDiv.textContent = 'Saving to Script Properties...';

      google.script.run
        .withSuccessHandler(function() {
          statusDiv.className = 'status-success';
          statusDiv.textContent = '✔ All properties successfully updated!';
          checkGlobalValidity();
          setTimeout(function() { statusDiv.style.display = 'none'; }, 4000);
        })
        .withFailureHandler(function(err) {
          statusDiv.className = 'status-error';
          statusDiv.textContent = 'Save failed: ' + err.message;
          checkGlobalValidity();
        })
        .saveAllConfigs(payload);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
