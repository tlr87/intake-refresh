    html,

    .container {

      margin: 60px auto;

    .card {
      overflow: hidden;

      font-size: 11px;

    .value {

      border-radius: 8px;
      color: #f8fafc;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .actions {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #334155;
    }

      display: inline-block;

  <div class="container">


<div class="card">

  <div class="header">

    <div class="icon">
      ⚠️

    <h1>
      Router Error
    </h1>

    <div class="subtitle">
      RD3 Tech Web App was unable to render the requested page.
    </div>

  </div>


  <div class="body">

    <p class="message">
      The router caught the error shown below.
      This page displays that error only.
    </p>


    <div class="label">
      Requested Page
    </div>

    <div class="value">
      <?= requestedPage ?>
    </div>


    <? if (errorMessage) { ?>

      <div class="label">
        Error
      </div>

      <div class="value">
        <?= errorMessage ?>
      </div>

    <? } ?>


    <? if (webAppUrl) { ?>

      <div class="actions">

        <a
          class="button"
          href="<?= webAppUrl ?>"
        >
          Return to Admin
        </a>

      </div>

    <? } ?>

  </div>


  <div class="footer">

  </div>

</div>
