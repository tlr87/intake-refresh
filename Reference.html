<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: #f8fafc;
    }

    h1 {
      color: #38bdf8;
      font-size: 20px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 20px;
    }

    pre {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      white-space: pre-wrap;
      overflow-x: auto;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    .error {
      color: #fca5a5;
    }
  </style>
</head>

<body>

  <h1>📚 FIELD_SCHEMA Reference</h1>

  <div class="subtitle">
    Current FIELD_SCHEMA from Script Properties
  </div>

  <pre id="output">Loading FIELD_SCHEMA...</pre>

  <script>
    google.script.run
      .withSuccessHandler(function(schema) {

        document.getElementById('output').textContent =
          JSON.stringify(schema, null, 2);

      })
      .withFailureHandler(function(error) {

        document.getElementById('output').innerHTML =
          '<span class="error">' +
          'Unable to load FIELD_SCHEMA: ' +
          error.message +
          '</span>';

      })
      .getFieldSchemaForReference();
  </script>

</body>
</html>
