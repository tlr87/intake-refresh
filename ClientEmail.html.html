<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; padding: 0; background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .wrapper { padding: 20px 0; background-color: #f1f5f9; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .header { background-color: #1A365D; padding: 24px; color: #ffffff; }
    .header h1 { margin: 0; font-size: 22px; color: #ffffff; font-weight: 700; }
    .header p { margin: 6px 0 0 0; font-size: 11px; color: #93c5fd; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .content { padding: 24px; color: #334155; }
    .intro { font-size: 15px; line-height: 1.6; margin-top: 0; margin-bottom: 20px; }
    .summary-heading { font-size: 13px; font-weight: bold; color: #1A365D; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; border-bottom: 2px solid #e2e8f0; padding-bottom: 4px; }
    .field-box { background-color: #f8fafc; padding: 12px; margin-bottom: 8px; border-radius: 6px; }
    .field-title { font-size: 12px; font-weight: bold; color: #64748b; }
    .field-value { font-size: 14px; color: #0f172a; margin-top: 4px; line-height: 1.4; }
    .footer { background-color: #f8fafc; padding: 20px; text-align: center; font-size: 12px; color: #64748b; border-top: 1px solid #e2e8f0; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <h1>RD3 TECH</h1>
        <p>Understand &rarr; Recommend &rarr; Solve &rarr; Support</p>
      </div>
      <div class="content">
        <p class="intro">
          Hi <?= name ? name : 'there' ?>,<br><br>
          Thank you for contacting <strong>RD3 Tech</strong>. We have received your request and will review it shortly to get back to you with next steps.
        </p>

        <div class="summary-heading">Summary of Your Enquiry</div>

        <!-- Dynamic Form Questions Copy -->
        <? for (var i = 0; i < fields.length; i++) { ?>
          <div class="field-box">
            <div class="field-title"><?= fields[i].title ?></div>
            <div class="field-value">
              <? if (Array.isArray(fields[i].value)) { ?>
                <? for (var j = 0; j < fields[i].value.length; j++) { ?>
                  <div>&bull; <?= fields[i].value[j] ?></div>
                <? } ?>
              <? } else { ?>
                <?= fields[i].value ?>
              <? } ?>
            </div>
          </div>
        <? } ?>

      </div>
      <div class="footer">
        <strong>RD3 Tech</strong><br>
        Need help with your technology? We’ll help you find the right solution.
      </div>
    </div>
  </div>
</body>
</html>
